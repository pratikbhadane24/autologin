[package]
name = "autologin"
version = "2.0.0"
description = "AutoLogin - automated broker logins for Cirrus"
authors = ["Pratik Bhadane"]
edition = "2021"

[lib]
name = "autologin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2"
toml = "0.9"
regex = "1"
tracing = "0.1"
totp-rs = "5"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
dirs = "6"
include_dir = "0.7"
ed25519-dalek = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
csv = "1"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2"
futures = "0.3"
arc-swap = "1"
tempfile = "3"
tokio-util = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# Desktop only: Chrome automation, tray, autostart, self-update, single instance.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
chromiumoxide = { version = "0.9", default-features = false, features = ["bytes"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"

# Android Keystore access for the vault key (store/android_keystore.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# OS keychain (macOS/iOS Keychain, Windows Credential Manager, Secret Service).
# Android wraps the vault key with the Keystore instead (store/android_keystore.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

[profile.release]
# Thin LTO: about 4x faster release links than fat LTO with one codegen unit,
# for a ~18% larger binary (measured 2026-10-08). Keeps CI releases quick.
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
