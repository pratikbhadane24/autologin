id = "motilal"
name = "Motilal Oswal"
kind = "http"
flow = "motilal"
aliases = ["motilal", "motilal oswal", "motilaloswal", "mosl"]

[[fields]]
key = "client_id"
label = "Client ID"
from_cirrus = true

[[fields]]
key = "api_key"
label = "API Key"
help = "From your Motilal Oswal OpenAPI registration (invest.motilaloswal.com)."
from_cirrus = true

[[fields]]
key = "api_secret"
label = "API Secret"
help = "The secret key of your Motilal Oswal OpenAPI app. Motilal's login (v7) requires it."
secret = true

[[fields]]
key = "password"
label = "Password"
secret = true

# Motilal accepts either the date of birth or the PAN as the second factor.
# The key stays "dob" so existing accounts keep their saved value.
[[fields]]
key = "dob"
label = "DOB or PAN (2FA)"
placeholder = "dd/mm/yyyy or ABCDE1234F"
pattern = "^([0-9]{2}/[0-9]{2}/[0-9]{4}|[A-Za-z]{5}[0-9]{4}[A-Za-z])$"
secret = true

[[fields]]
key = "totp_key"
label = "TOTP Secret"
secret = true
totp = true

[consts]
# v7 per Motilal's API docs (invest.motilaloswal.com/moAPI/APIDocumentation)
# and PythonSDK (github.com/motradingapi/PythonSDK, "Python 5.0", 2026-09-04).
# Older versions now answer "Login via existing version is restricted".
login_url = "https://openapi.motilaloswal.com/rest/login/v7/authdirectapi"

# Device headers Motilal's API expects. Kept as data so they can be updated
# from the remote manifest if the API starts rejecting them. The v7 set mirrors
# PythonSDK's MOFSLOPENAPI.validate(): apisecretkey is now mandatory, and
# accesstoken/Authorization are sent empty at login. installedappid is a fresh
# id per login, added by http_flows/motilal.rs like the SDK's uuid1().
[headers]
"User-Agent" = "MOSL/V.1.1.0"
sourceid = "web"
macaddress = "00:00:00:00:00:00"
clientlocalip = "127.0.0.1"
clientpublicip = "1.2.3.4"
vendorinfo = "{client_id}"
ApiKey = "{api_key}"
osname = "Windows 10"
osversion = "10.0.19041"
devicemodel = "AHV"
manufacturer = "DELL"
browsername = "Chrome"
browserversion = "135.0"
productname = "Investor"
productversion = "1"
apisecretkey = "{api_secret}"
accesstoken = ""
Authorization = ""
sdkversion = "Python 5.0"
latitude = "0.0000"
longitude = "0.0000"

[session]
reset = "05:00"
tz = "Asia/Kolkata"

[callback]
endpoint = "/api/sessions/motilal-oswal/callback"
body = { authtoken = "{vars.auth_token}", client_id = "{client_id}" }
