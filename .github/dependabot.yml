version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date (Dependabot
  # bumps the SHA and the trailing "# vX.Y.Z" comment together).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'
